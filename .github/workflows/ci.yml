name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The libdns test suite module needs a newer Go version than the provider itself.
      - uses: actions/setup-go@v7
        with:
          go-version-file: libdnstest/go.mod

      - name: Vet libdns test suite
        working-directory: libdnstest
        run: go vet ./...

  # Runs the integration test against the real Domain Chief API.
  # Needs the DOMAINCHIEF_TEST_ZONE repository variable and DOMAINCHIEF_API_TOKEN repository secret.
  integration:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    concurrency:
      group: integration
    env:
      DOMAINCHIEF_TEST_ZONE: ${{ vars.DOMAINCHIEF_TEST_ZONE }}
      DOMAINCHIEF_API_TOKEN: ${{ secrets.DOMAINCHIEF_API_TOKEN }}
    steps:
      - name: Check configuration
        id: configured
        run: |
          if [ -n "$DOMAINCHIEF_TEST_ZONE" ] && [ -n "$DOMAINCHIEF_API_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping integration tests, DOMAINCHIEF_TEST_ZONE or DOMAINCHIEF_API_TOKEN is not configured."
          fi

      - uses: actions/checkout@v7
        if: steps.configured.outputs.ok == 'true'

      - uses: actions/setup-go@v7
        if: steps.configured.outputs.ok == 'true'
        with:
          go-version-file: go.mod

      - name: Integration test
        if: steps.configured.outputs.ok == 'true'
        run: go test -count=1 -run TestIntegration -v ./...
